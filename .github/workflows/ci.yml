name: CI

on:
  push:
    branches: [main]
  pull_request:

# FXS-06: the job only reads the code
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # A throwaway PostgreSQL that exists only for this job.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_saas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FXS-06: known vulnerabilities in what the app ships fail the build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
