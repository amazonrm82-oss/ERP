name: CI

on:
  push:
    branches: [main]
  pull_request:
  # DSN-18: run by hand (Actions > CI > Run workflow) with screenshots = update to get fresh
  # screenshot baselines made on the runner; they come back as the artifact screenshots-<run>.
  # A run started by hand never promotes (promote runs on a push to main only).
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Screenshots: compare with tests/visual/baseline, or update (hand over fresh baselines)"
        type: choice
        options: [compare, update]
        default: compare

# FXS-06: the job only reads the code
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # A throwaway PostgreSQL that exists only for this job.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_saas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
      # FXS-06: known vulnerabilities in what the app ships fail the build (and so block promote);
      # RVW-53: run last, so an advisory never hides the real checks above
      - run: npm audit --omit=dev --audit-level=high

  # OPS-01 / RVW-7: the browser flow (tests/e2e/main-flow.mjs) against a throwaway
  # local Supabase stack on the runner, the way the lead runs it before a merge.
  # Every key here is a local default printed by the CLI or made up for this run:
  # no repository secret is used, and nothing leaves the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      E2E_SHOTS_DIR: ${{ github.workspace }}/e2e-artifacts/shots
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Start the local Supabase stack (applies supabase/migrations)
        # the CLI version is the one in package.json (stack:start); services the flow never uses stay off
        run: npx -y supabase@2.121.0 start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Point the app at the local stack
        run: |
          set -euo pipefail
          npx -y supabase@2.121.0 status -o env | grep -E '^[A-Z_][A-Z0-9_]*=' > "$RUNNER_TEMP/stack.env"
          set -a; . "$RUNNER_TEMP/stack.env"; set +a
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!v:-}" ]; then echo "::error::supabase status did not print $v"; exit 1; fi
          done
          case "$API_URL" in http://127.0.0.1:*|http://localhost:*) ;; *) echo "::error::not a local stack: $API_URL"; exit 1;; esac
          vapid="$(npx web-push generate-vapid-keys --json)"
          dispatch_secret="$(openssl rand -hex 32)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$(node -e 'console.log(JSON.parse(process.argv[1]).publicKey)' "$vapid")"
            echo "VAPID_PRIVATE_KEY=$(node -e 'console.log(JSON.parse(process.argv[1]).privateKey)' "$vapid")"
            echo "PUSH_DISPATCH_SECRET=$dispatch_secret"
          } >> "$GITHUB_ENV"
          # the database wakes the app through pg_net (push dispatch, night file cleanup):
          # from inside the stack's containers the runner is the Docker network's gateway
          gateway="$(docker network inspect supabase_network_crm-saas-local --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)"
          host="${gateway:-host.docker.internal}"
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -v url="http://$host:3000/api/push/dispatch" -v secret="$dispatch_secret" <<'SQL'
          insert into app.settings (key, value) values ('push_dispatch_url', :'url'), ('push_dispatch_secret', :'secret')
          on conflict (key) do update set value = excluded.value;
          SQL
      - name: Build the app against the local stack
        run: npm run build
      - name: Start the app
        run: |
          mkdir -p "$E2E_SHOTS_DIR"
          nohup npm run start -- -p 3000 > "$E2E_ARTIFACTS/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 2
          done
          echo "::error::the app did not answer on port 3000"; cat "$E2E_ARTIFACTS/app.log"; exit 1
      - name: Browser flow
        run: npm run test:e2e
      # DSN-18: the main screens and the design gallery at 360px and 1280px against the baselines
      # committed in tests/visual/baseline (made by this job on the runner); same stack and server.
      # A change in appearance fails the job, so promote does not move production.
      - name: Screenshot comparison
        id: visual
        env:
          VISUAL_MODE: ${{ inputs.screenshots || 'compare' }}
          VISUAL_OUT: ${{ github.workspace }}/e2e-artifacts/visual
        run: node tests/visual/run.mjs "$VISUAL_MODE"
      - name: Upload the screenshots
        if: always() && steps.visual.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/visual/
          retention-days: 14
          if-no-files-found: ignore
      - name: Collect the stack's logs
        if: failure()
        run: |
          mkdir -p "$E2E_ARTIFACTS/stack"
          for c in $(docker ps -a --filter name=supabase_ --format '{{.Names}}'); do
            docker logs "$c" > "$E2E_ARTIFACTS/stack/$c.log" 2>&1 || true
          done
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # GATE-01: the live site is built from the `production` branch, which moves
  # only here, after every check above (the browser flow included, OPS-01) passed
  # on this commit of main.
  # RVW-21: there is no concurrency group any more. GitHub keeps one pending job per
  # group and cancels the older pending one, whatever the commit order, so a newer
  # commit's promotion could be cancelled and `production` stayed behind; and a plain
  # push failed red when a newer commit had already been promoted. Now every green
  # run promotes: it does nothing when `production` already contains its commit,
  # fast-forwards it otherwise (a plain push, never a force: it cannot move backwards),
  # and tries again when another run moved `production` in between.
  promote:
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move production forward to this commit
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            if git fetch --quiet origin +refs/heads/production:refs/remotes/origin/production; then
              if git merge-base --is-ancestor "$sha" origin/production; then
                echo "production ($(git rev-parse --short origin/production)) already contains $sha"
                exit 0
              fi
              if ! git merge-base --is-ancestor origin/production "$sha"; then
                echo "::error::production is not an ancestor of $sha: it was moved by hand; not forcing it"
                exit 1
              fi
            fi
            if git push origin "$sha:refs/heads/production"; then
              exit 0
            fi
            echo "push refused (attempt $attempt): another run moved production; checking again"
            sleep $((attempt * 5))
          done
          echo "::error::could not move production to $sha"
          exit 1
