name: CI

on:
  push:
    branches: [main]
  pull_request:

# FXS-06: the job only reads the code
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # A throwaway PostgreSQL that exists only for this job.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/crm_saas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FXS-06: known vulnerabilities in what the app ships fail the build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build

  # GATE-01: the live site is built from the `production` branch, which moves
  # only here, after every check above passed on this commit of main. A plain
  # push (no force) refuses to move it backwards if an older run ends last.
  promote:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/production
